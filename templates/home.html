    <!DOCTYPE html>
    <html lang="ru">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Task Board</title>
        <style>
            * { margin: 0; padding: 0; box-sizing: border-box; }
            body {
                font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
                background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
                min-height: 100vh;
                display: flex;
                justify-content: center;
                align-items: center;
            }
            .card {
                background: white;
                border-radius: 30px;
                padding: 50px 60px;
                text-align: center;
                max-width: 550px;
                box-shadow: 0 25px 50px rgba(0,0,0,0.3);
            }
            h1 {
                font-size: 3rem;
                color: #333;
                margin-bottom: 15px;
            }
            .gradient {
                background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
                -webkit-background-clip: text;
                -webkit-text-fill-color: transparent;
            }
            p {
                color: #666;
                font-size: 1.1rem;
                margin-bottom: 30px;
            }
            .features {
                display: flex;
                justify-content: center;
                gap: 30px;
                margin: 30px 0;
            }
            .feature {
                text-align: center;
            }
            .feature-icon {
                font-size: 2rem;
                margin-bottom: 8px;
            }
            .feature-text {
                font-size: 0.8rem;
                color: #888;
            }
            .btn {
                display: inline-block;
                padding: 14px 35px;
                background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
                color: white;
                text-decoration: none;
                border-radius: 50px;
                font-weight: 600;
                transition: transform 0.2s;
            }
            .btn:hover {
                transform: translateY(-3px);
            }
        </style>
    </head>
    <body>
        <div class="card">
            <h1>📋 <span class="gradient">Task Board</span></h1>
            <p>Управляйте задачами легко и красиво</p>
            <div class="features">
                <div class="feature">
                    <div class="feature-icon">✅</div>
                    <div class="feature-text">3 статуса</div>
                </div>
                <div class="feature">
                    <div class="feature-icon">🎨</div>
                    <div class="feature-text">3 приоритета</div>
                </div>
                <div class="feature">
                    <div class="feature-icon">📊</div>
                    <div class="feature-text">Статистика</div>
                </div>
            </div>
            <a href="/board" class="btn">🚀 Начать</a>
        </div>
    </body>
    </html>
